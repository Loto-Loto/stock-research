<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式リサーチ</title>
<style>
body {
  font-family: sans-serif;
  background: #f3f5f8;
  color: #222;
  margin: 0;
  padding: 20px;
}
h1 { font-size: 25px; }
.subtitle { color: #666; font-size: 14px; }
.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin: 16px 0;
  box-shadow: 0 2px 8px #0000000d;
}
.name { font-size: 18px; font-weight: bold; }
.code { color: #777; font-size: 13px; }
.note { color: #555; font-size: 14px; }
.tag {
  display: inline-block;
  background: #e8f0ff;
  color: #2458a6;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 12px;
}
</style>
</head>
<body>
<h1>📈 株式リサーチ</h1>
<p class="subtitle">My Stock Research｜監視銘柄</p>

<div class="card">
  <div class="name">東京エレクトロン</div>
  <div class="code">8035｜東証プライム</div>
  <p class="note">株価・信用倍率・ニュースをここに集約</p>
  <span class="tag">半導体製造装置</span>
</div>

<div class="card">
  <div class="name">TDK</div>
  <div class="code">6762｜東証プライム</div>
  <p class="note">株価・信用倍率・ニュースをここに集約</p>
  <span class="tag">電子部品・AI関連</span>
</div>

<div class="card">
  <h2>📝 今日の分析</h2>
  <p class="note">これから信用需給の変化、決算、ニュースをもとに分析できるようにしていきます。</p>
</div>

<p class="subtitle">初期バージョン｜株価データはまだ未接続</p>
</body>
</html>
